- id: cb-005
  canonical_claim: "Nana Patekar is no more in this world today, passed away recently"
  variants:
    - "Nana Patekar passed away"
    - "There is bad news nana Patekar is no more in this world today"
    - "नाना पाटेकर यांचे निधन झाले"
    - "नाना पाटेकर का निधन हो गया"
  key_details: []
  verdict: REFUTED
  explanation_en: "Nana Patekar is alive and in good health. The viral message claiming his demise is a recurring death hoax that has circulated multiple times on social media and has been officially debunked."
  sources:
    - url: "https://www.boomlive.in/fact-check/nana-patekar-death-hoax-fact-check"
      publisher: "BOOM Live"
      published_date: "2024-06-15"
