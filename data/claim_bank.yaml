- id: cb-006
  canonical_claim: "Lemon juice cures cancer in 48 hours without treatment"
  variants:
    - "Lemon juice hot water cures cancer completely in 48 hours"
    - "नींबू का रस पीने से 48 घंटे में कैंसर ठीक हो जाता है"
    - "Drinking hot lemon water kills cancer cells 10000 times better than chemo"
  key_details: []
  verdict: REFUTED
  explanation_en: "There is no scientific, clinical, or oncological evidence that lemon juice or alkaline water cures cancer. Delaying medical cancer treatment in favor of unverified remedies is dangerous."
  sources:
    - url: "https://www.boomlive.in/fact-check/fake-news-hot-lemon-water-cure-cancer-fact-check"
      publisher: "BOOM Live"
      published_date: "2023-04-10"
      tier: 1
    - url: "https://who.int/news-room/fact-sheets/detail/cancer"
      publisher: "World Health Organization"
      published_date: "2023-05-01"
      tier: 2
  category: medical_myth
  last_reviewed: "2026-01-01"
  review_by: "2027-01-01"

- id: cb-007
  canonical_claim: "Drinking fluorine or fluoride cures diseases"
  variants:
    - "fluorine peene se bimari hogi theek"
    - "fluoride water cures all diseases"
    - "fluoride se bimari theek hoti hai"
    - "drinking fluoride treats illness"
  key_details: []
  verdict: REFUTED
  explanation_en: "Fluorine is a highly toxic, reactive gas that is dangerous to human health. Fluoride compounds, even at low concentrations, do not cure diseases. High fluoride exposure causes fluorosis and organ damage. There is no scientific or medical evidence that drinking fluorine or fluoride-based substances treats any disease. WHO and ICMR guidelines strictly limit fluoride in drinking water for safety reasons."
  sources:
    - url: "https://www.who.int/teams/environment-climate-change-and-health/chemical-safety-and-health/health-topics/fluoride"
      publisher: "World Health Organization"
      published_date: "2023-06-01"
      tier: 2
    - url: "https://www.icmr.gov.in"
      publisher: "ICMR"
      published_date: "2022-01-01"
      tier: 2
  category: health_cure
  last_reviewed: "2026-01-10"
  review_by: "2027-01-10"

- id: cb-008
  canonical_claim: "Government of India has imposed tax on UPI payments"
  variants:
    - "Government has imposed tax on UPI"
    - "UPI payments will now be taxed"
    - "UPI pe tax lagega"
    - "NPCI has introduced charges on UPI transactions"
    - "RBI imposed 2 percent tax on UPI"
    - "सरकार ने UPI पर टैक्स लगाया"
  key_details: []
  verdict: REFUTED
  explanation_en: "The Government of India has not imposed any tax on UPI payments. NPCI and RBI have both confirmed that standard person-to-person and person-to-merchant UPI transactions remain completely free for regular users. This is a recurring viral hoax that has been debunked multiple times by PIB Fact Check."
  sources:
    - url: "https://pib.gov.in/PressReleasePage.aspx?PRID=1911855"
      publisher: "PIB Fact Check"
      published_date: "2023-03-29"
      tier: 2
    - url: "https://npci.org.in"
      publisher: "NPCI"
      published_date: "2023-01-01"
      tier: 2
  category: banking_scam
  last_reviewed: "2026-01-10"
  review_by: "2027-01-10"

- id: cb-009
  canonical_claim: "5G towers cause cancer and health problems"
  variants:
    - "5G se cancer hota hai"
    - "5G towers are harmful to human health"
    - "5G radiation causes disease"
    - "5G towers spread coronavirus"
  key_details: []
  verdict: REFUTED
  explanation_en: "There is no scientific evidence that 5G towers cause cancer or any disease. 5G uses non-ionizing radio frequency radiation, which does not damage DNA or cause cancer. WHO and ICNIRP have reviewed the evidence and found 5G safe within established guidelines. The claim that 5G spread COVID-19 is also false."
  sources:
    - url: "https://www.who.int/news-room/questions-and-answers/item/radiation-5g-mobile-networks-and-health"
      publisher: "World Health Organization"
      published_date: "2020-10-01"
      tier: 2
  category: health_tech
  last_reviewed: "2026-01-10"
  review_by: "2027-01-10"

- id: cb-010
  canonical_claim: "WhatsApp is shutting down or will start charging users"
  variants:
    - "WhatsApp band ho raha hai"
    - "WhatsApp is shutting down tonight"
    - "WhatsApp will charge Rs 1 per message"
    - "WhatsApp is going to be paid"
    - "forward to 10 people or your account will be deleted"
  key_details: []
  verdict: REFUTED
  explanation_en: "WhatsApp is not shutting down and has not announced any charges for regular users. WhatsApp is free to use for personal messaging. Chain messages saying WhatsApp will shut down or become paid are a recurring hoax. Forward-or-lose-account messages are manipulation tactics, not real warnings from WhatsApp."
  sources:
    - url: "https://www.boomlive.in/fact-check/whatsapp-shutdown-hoax"
      publisher: "BOOM Live"
      published_date: "2022-01-01"
      tier: 1
  category: app_hoax
  last_reviewed: "2026-01-10"
  review_by: "2027-01-10"

- id: cb-011
  canonical_claim: "PM Modi announced free smartphones for all students under Digital India"
  variants:
    - "Modi ji ne free smartphone dene ka ailan kiya"
    - "government is giving free smartphones to students"
    - "Digital Bharat yojana mein free mobile milega"
    - "सरकार सभी छात्रों को मुफ्त स्मार्टफोन दे रही है"
  key_details: []
  verdict: REFUTED
  explanation_en: "The central government has not announced any scheme providing free smartphones to all students under Digital India. Such viral messages are fabricated and often link to phishing websites that steal personal data. PIB Fact Check has repeatedly debunked free smartphone scheme messages. Always verify government schemes at india.gov.in or mygov.in."
  sources:
    - url: "https://pib.gov.in/factcheck.aspx"
      publisher: "PIB Fact Check"
      published_date: "2023-06-01"
      tier: 2
  category: government_scheme_scam
  last_reviewed: "2026-01-10"
  review_by: "2027-01-10"

